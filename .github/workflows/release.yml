name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Generate release
        run: |
          git archive --format=tar.xz --prefix=miku-cursor-linux/ HEAD:miku-cursor-linux/  | xz -9 -c > miku-cursor-linux.tar.xz
          git archive --format=tar.xz --prefix=miku-cursor-hyprland/ HEAD:miku-cursor-hyprland  | xz -9 -c > miku-cursor-hyprland.tar.xz
          git archive --format=zip --prefix=miku-cursor-windows/ HEAD:miku-cursor-windows/ -o miku-cursor-windows.zip
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            miku-cursor-linux.tar.xz
            miku-cursor-hyprland.tar.xz
            miku-cursor-windows.zip
